version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: yahoo-finance-mcp
    main: .
    binary: yahoo-finance-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: 'checksums.txt'

release:
  header: |
    ## Which file do I need?

    - **Claude Desktop:** download the `.mcpb` file for your platform and install it via *Settings → Extensions*. On Windows that is `win32_amd64` (or `win32_arm64`). Do not use the *Upload local plugin* dialog; it is for Claude plugins, not MCP extensions.
    - **Homebrew / manual install:** the `.tar.gz` and `.zip` archives contain just the binary. See the [README](https://github.com/emmanuelay/yahoo-finance-mcp#install) for configuring Claude Desktop or Claude Code with it.

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - repository:
      owner: emmanuelay
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/emmanuelay/yahoo-finance-mcp"
    description: "MCP server for Yahoo Finance data"
    license: "MIT"
    download_strategy: CurlDownloadStrategy
